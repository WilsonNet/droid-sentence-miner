name: Release

# Pushing a tag like v0.2.0 builds a signed release APK and publishes it as a GitHub release.
# Tags are only pushed when a release is explicitly requested (see .opencode/skills/dsm-release).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5  # v6 adds proprietary caching terms

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DSM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::DSM_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DSM_KEYSTORE_PASSWORD: ${{ secrets.DSM_KEYSTORE_PASSWORD }}
          DSM_KEY_ALIAS: ${{ secrets.DSM_KEY_ALIAS }}
          DSM_KEY_PASSWORD: ${{ secrets.DSM_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Monotonic versionCode so each tagged APK upgrades the previous one in place.
          CODE=$(git rev-list --count HEAD)
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODE" --console=plain
          cp app/build/outputs/apk/release/app-release.apk "droid-sentence-miner-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "droid-sentence-miner-$GITHUB_REF_NAME.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
